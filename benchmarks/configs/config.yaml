output_root: "reports"
cache_dir: "cache"
log_dir: "logs"
cbt_config: "configs/cbt.yaml"
# rv_config: "configs/rv.yaml"
# ra37_config: "configs/ra37.yaml"

save_intermediate: true
max_examples: 999           # e.g., 50 for quick dev runs; null to use full dataset

parallel: true
parallel_max_batch: 16

use_cache: true
cache_max_age_days: 1     # e.g., 14 to clear entries older than 14 days; null to disable
